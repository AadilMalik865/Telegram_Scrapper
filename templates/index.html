<!DOCTYPE html>
<html>
<head>
    <title>Telegram Scraper</title>
</head>
<body>
    <h1>Telegram Scraper</h1>

    <!-- Login with another account button -->
    <p>
        <a href="{{ url_for('auth.login') }}">
            <button type="button">Login with another account</button>
        </a>
    </p>

    <form method="POST">
        <input type="text" name="channel_url" placeholder="Enter Telegram channel/post URL" required>
        <button type="submit">Fetch</button>
    </form>

    {% if file_exists %}
        <p>Scraping completed! ✅</p>
        <a href="{{ url_for('download', file_name=file_name) }}">Download CSV</a>
    {% endif %}
</body>
</html>
