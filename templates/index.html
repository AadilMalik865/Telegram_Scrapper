<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Scraper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10">

    <div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-3xl">
        <h1 class="text-3xl md:text-4xl font-bold text-center mb-8">📡 Telegram Scraper</h1>

        <div class="text-center mb-8">
            <a href="{{ url_for('auth.login') }}">
                <button class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg transition-all shadow">
                    Login with another account
                </button>
            </a>
        </div>

        <form method="POST" class="mb-8">
            <label class="block text-lg font-medium mb-2">Enter multiple Telegram URLs (one per line):</label>
            <textarea name="channel_urls" rows="6" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"
                placeholder="https://t.me/example_channel/12345" required></textarea>
            <div class="text-center mt-4">
                <button type="submit" 
                    class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-6 rounded-lg transition-all shadow">
                    Fetch
                </button>
            </div>
        </form>

        <h3 class="text-xl font-semibold mb-2">📡 Progress:</h3>
        <div id="progressBox" 
             class="border border-gray-300 p-4 h-64 overflow-y-scroll rounded-lg bg-gray-50 mb-6 scrollbar-thin scrollbar-thumb-gray-400 scrollbar-track-gray-200">
        </div>

        <script>
            var source = new EventSource("{{ url_for('progress') }}");
            source.onmessage = function(event) {
                var box = document.getElementById("progressBox");
                box.innerHTML += event.data + "<br>";
                box.scrollTop = box.scrollHeight;
            };
        </script>

        {% if file_exists %}
            <div class="text-center mt-6">
                <p class="text-green-600 font-semibold mb-4 text-lg">🎉 Scraping completed successfully! ✅</p>
                <a href="{{ url_for('download', file_name=file_name) }}" 
                   class="bg-purple-500 hover:bg-purple-600 text-white py-2 px-6 rounded-lg transition-all shadow inline-block">
                    Download CSV
                </a>
            </div>
        {% endif %}
    </div>

</body>
</html>
